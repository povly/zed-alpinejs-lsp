name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Full build verification (TS → Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Шаг 1: сборка TS в server/dist/ (встраивается в Rust через include_str!())
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      # Шаг 2: проверка что Rust компилируется с встроенным JS
      - run: cargo check --release
